# 进销存管理系统 Nginx 配置
# 使用方法: 将本文件复制到 Nginx 安装目录的 conf/ 下覆盖 nginx.conf, 然后启动 nginx.exe
# 前端路由为 hash 模式, 无需 try_files 兜底

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    # 文件上传大小限制(与后端 50MB 对齐)
    client_max_body_size 50m;

    server {
        listen       8088;
        server_name  localhost;

        # 前端静态资源 (Vue dist 目录)
        location / {
            root   E:/jxc/deploy/web/dist;
            index  index.html;
        }

        # 后端接口反向代理 (前端 baseURL=/jxc, 后端 context-path=/jxc)
        location /jxc/ {
            proxy_pass http://127.0.0.1:8080/jxc/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }
    }
}
