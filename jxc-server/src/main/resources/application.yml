server:
  port: 8080
  servlet:
    context-path: /jxc
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: jxc-server
  profiles:
    active: dev
  # JSON 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.jxc.module.*.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-methods: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志
logging:
  level:
    com.jxc: debug
    org.springframework: warn

# JWT 配置
jxc:
  jwt:
    secret: jxcSecretKey2026ForJwtTokenSign
    # token 有效期(分钟)
    expire: 120
    header: Authorization
  # 文件上传配置
  upload:
    # 上传文件存储目录(相对于项目运行目录)
    path: ./uploads
    # 文件访问URL前缀
    url-prefix: /uploads
